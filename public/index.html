<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joc de preguntes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="funcions.js" defer></script>
</head>

<body class="bg-light">
    <div class="container py-4">

        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Joc de preguntes</h1>
            <a href="admin.html" class="btn btn-outline-secondary">Administració</a>
        </header>

        <main>
            <!-- Iteració 6: nom de l'usuari -->
            <section class="mb-4">
                <p id="salutacio" class="lead mb-2"></p>

                <form id="formNom" class="row g-2">
                    <div class="col-auto">
                        <label for="inputNom" class="visually-hidden">Com et dius?</label>
                        <input type="text" id="inputNom" class="form-control" placeholder="Com et dius?">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Guardar nom</button>
                    </div>
                </form>

                <button id="btnEsborrarNom" class="btn btn-outline-danger btn-sm d-none">Esborrar nom</button>
            </section>

            <!-- Iteració 7: comptador de temps -->
            <div class="d-flex justify-content-between mb-3">
                <div id="marcador" class="fw-semibold"></div>
                <div id="temporitzador" class="fw-semibold"></div>
            </div>

            <div id="partida"></div>

            <button id="enviarResultats" class="btn btn-success d-none">Enviar Resultats</button>
        </main>

    </div>
</body>
</html>
